name: Publish Newsletter
on:
  workflow_dispatch:
concurrency:
  group: publish-newsletter
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v5
        with:
          path: /home/runner/.cache/ms-playwright
          key: ubuntu-24.04-${{ runner.arch }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npm run generate
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment-primary
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 120000
      - id: deployment-retry
        if: steps.deployment-primary.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 180000
      - name: Fail if GitHub Pages could not deploy
        if: steps.deployment-primary.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        run: |
          echo "GitHub Pages did not complete its initial 2-minute deployment or the 3-minute retry."
          exit 1
      - name: Verify the published newsletter assets
        run: npm run verify:published
      - name: Create ActiveCampaign draft and email test
        env:
          ACTIVE_CAMPAIGN_URL: ${{ secrets.ACTIVE_CAMPAIGN_URL }}
          ACTIVE_CAMPAIGN_API_TOKEN: ${{ secrets.ACTIVE_CAMPAIGN_API_TOKEN }}
        run: npm run activecampaign:publish-draft
