name: Publish Newsletter
on:
  workflow_dispatch:
concurrency:
  group: publish-newsletter
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v5
        with:
          path: /home/runner/.cache/ms-playwright
          key: ubuntu-24.04-${{ runner.arch }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npm run generate
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the published newsletter assets
        run: npm run verify:published
      - name: Create ActiveCampaign draft and email test
        env:
          ACTIVE_CAMPAIGN_URL: ${{ secrets.ACTIVE_CAMPAIGN_URL }}
          ACTIVE_CAMPAIGN_API_TOKEN: ${{ secrets.ACTIVE_CAMPAIGN_API_TOKEN }}
        run: npm run activecampaign:publish-draft
